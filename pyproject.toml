[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "palmpagegi-batchplan"
version = "0.1.0"
description = "按延迟要求与截止时间给任务排序分批，输出调度计划"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "palmpagegi" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://palmpagegi.github.io"
Repository = "https://github.com/palmpagegi/batchplan"
Issues = "https://github.com/palmpagegi/batchplan/issues"

[project.scripts]
batchplan = "batchplan:main"

[tool.setuptools]
py-modules = ["batchplan"]
